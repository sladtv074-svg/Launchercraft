<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launchcraft</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  overflow: hidden;
}

.launcher {
  display: flex;
  width: 100vw;
  height: 100vh;
}

/* BARRE LATÉRALE */

.sidebar {
  width: 115px;
  height: 100vh;
  background: #171717;
  border-right: 2px solid #292929;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 8px;
  gap: 10px;
  z-index: 5;
}

.logo {
  width: 58px;
  height: 58px;
  image-rendering: pixelated;
  margin-bottom: 15px;
}

.menu-button {
  width: 96px;
  min-height: 72px;
  border: none;
  background: transparent;
  color: #aaa;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  border-radius: 5px;
  cursor: pointer;
  transition: 0.2s;
  font-size: 12px;
}

.menu-button:hover,
.menu-button.active {
  background: #292929;
  color: white;
  border-left: 4px solid #20c46b;
}

.menu-icon {
  width: 29px;
  height: 29px;
  object-fit: contain;
  image-rendering: pixelated;
  filter: grayscale(100%);
}

.menu-button:hover .menu-icon,
.menu-button.active .menu-icon {
  filter: grayscale(0%);
}

.bottom-menu {
  margin-top: auto;
}

/* CONTENU PRINCIPAL */

.main {
  position: relative;
  flex: 1;
  height: 100vh;
  overflow: hidden;
  background-image:
    linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.45)),
    url("background.jpg");
  background-size: cover;
  background-position: center;
}

/* ASSOMBRISSEMENT DU FOND */

.main::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.15),
    rgba(0,0,0,.55)
  );
  pointer-events: none;
}

/* CONTENU CENTRAL */

.center-content {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.title {
  width: min(480px, 65vw);
  max-height: 180px;
  object-fit: contain;
  image-rendering: pixelated;
  margin-bottom: 55px;
  filter: drop-shadow(0 5px 5px rgba(0,0,0,.6));
}

/* BOUTON JOUER VERT */

.play-button {
  min-width: 260px;
  padding: 20px 55px;
  background: #20b963;
  border: 3px solid #108044;
  border-radius: 4px;
  color: white;
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow: 2px 2px #126b3b;
  box-shadow:
    0 5px 0 #0b542d,
    0 8px 18px rgba(0,0,0,.45);
  cursor: pointer;
  transition: .15s;
}

.play-button:hover {
  background: #2bd878;
  transform: translateY(-2px);
}

.play-button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #0b542d;
}

.version {
  margin-top: 22px;
  color: #ddd;
  font-size: 14px;
  text-shadow: 2px 2px #000;
}

/* RESPONSIVE IPAD / MOBILE */

@media (max-width: 700px) {
  .sidebar {
    width: 82px;
    padding: 12px 4px;
  }

  .logo {
    width: 48px;
    height: 48px;
  }

  .menu-button {
    width: 72px;
    min-height: 62px;
    font-size: 10px;
  }

  .menu-icon {
    width: 25px;
    height: 25px;
  }

  .title {
    width: 75vw;
    margin-bottom: 40px;
  }

  .play-button {
    min-width: 210px;
    padding: 16px 35px;
    font-size: 21px;
  }
}
</style>
</head>

<body>

<div class="launcher">

  <aside class="sidebar">

    <img src="grass-block.png" class="logo" alt="Launchcraft">

    <button class="menu-button active" onclick="selectMenu(this)">
      <span class="menu-icon">▶</span>
      <span>Jouer</span>
    </button>

    <button class="menu-button" onclick="selectMenu(this)">
      <span class="menu-icon">▦</span>
      <span>Mods</span>
    </button>

    <button class="menu-button" onclick="selectMenu(this)">
      <span class="menu-icon">?</span>
      <span>FAQ</span>
    </button>

    <button class="menu-button" onclick="selectMenu(this)">
      <span class="menu-icon">⬇</span>
      <span>Installer</span>
    </button>

    <button class="menu-button" onclick="selectMenu(this)">
      <span class="menu-icon">▣</span>
      <span>Skins</span>
    </button>

    <button class="menu-button" onclick="selectMenu(this)">
      <span class="menu-icon">▤</span>
      <span>Notes</span>
    </button>

    <div class="bottom-menu">

      <button class="menu-button" onclick="selectMenu(this)">
        <span class="menu-icon">⚙</span>
        <span>Réglages</span>
      </button>

      <button class="menu-button" onclick="selectMenu(this)">
        <span class="menu-icon">ⓘ</span>
        <span>Infos</span>
      </button>

    </div>

  </aside>

  <main class="main">

    <section class="center-content">

      <img
        src="launchcraft-title.png"
        class="title"
        alt="Launchcraft"
      >

      <button class="play-button" onclick="launchGame()">
        JOUER
      </button>

      <div class="version">
        Minecraft 1.12.2
      </div>

    </section>

  </main>

</div>

<script>
function selectMenu(button) {
  document.querySelectorAll(".menu-button").forEach(item => {
    item.classList.remove("active");
  });

  button.classList.add("active");
}

function launchGame() {
  window.location.href = "mc/1.12.2/";
}
</script>

</body>
</html>
